name: Scan runtime image
description: Require Docker Scout and Trivy to report zero known runtime vulnerabilities.

inputs:
  image-ref:
    description: Immutable remote platform manifest reference to scan.
    required: true
  platform:
    description: Container platform being scanned.
    required: false
    default: ''
  dockerhub-user:
    description: Docker Hub user for Docker Scout authentication.
    required: true
  dockerhub-token:
    description: Docker Hub token for Docker Scout authentication.
    required: true

runs:
  using: composite
  steps:
    - name: Scan all runtime vulnerabilities with Trivy
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      env:
        TRIVY_IMAGE_SRC: remote
        TRIVY_PLATFORM: ${{ inputs.platform }}
      with:
        scan-type: image
        image-ref: ${{ inputs.image-ref }}
        scanners: vuln
        vuln-type: os,library
        ignore-unfixed: false
        severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
        format: table
        exit-code: '1'
        timeout: 15m
    - name: Scan all runtime vulnerabilities with Docker Scout
      if: ${{ !cancelled() }}
      uses: docker/scout-action@7c6b6c3f7844478ace1ffd4e7aef649053d1f87d # v1.24.0
      with:
        command: cves
        image: registry://${{ inputs.image-ref }}
        platform: ${{ inputs.platform }}
        only-severities: critical,high,medium,low,unspecified
        exit-code: true
        summary: true
        write-comment: false
        dockerhub-user: ${{ inputs.dockerhub-user }}
        dockerhub-password: ${{ inputs.dockerhub-token }}
