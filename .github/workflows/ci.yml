name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    # Portable release artifacts are compiled canonically on linux/arm64.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Verify repository
        run: bun run ci:verify

      - name: Upload engine benchmark
        uses: actions/upload-artifact@v7
        with:
          name: engine-benchmarks
          path: artifacts/engine-benchmarks/*.json
