name: Docker Security Monitor

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homelab-inventory-docker-security-monitor
  cancel-in-progress: true

jobs:
  scan:
    name: Scan ${{ matrix.channel }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        channel:
          - latest
          - stable
    steps:
      - name: Checkout security policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Enforce runtime vulnerability policy
        uses: ./.github/actions/scan-runtime
        with:
          image-ref: mriverodorta/homelab-inventory:${{ matrix.channel }}
