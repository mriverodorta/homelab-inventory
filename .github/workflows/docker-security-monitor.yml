name: Docker Security Monitor

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homelab-inventory-docker-security-monitor
  cancel-in-progress: true

jobs:
  scan:
    name: Scan ${{ matrix.channel }} (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        channel:
          - latest
          - stable
        platform:
          - amd64
          - arm64
    steps:
      - name: Checkout security policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Resolve immutable platform manifest
        id: target
        run: node scripts/container-security/monitor-target.mjs "${{ matrix.channel }}" "${{ matrix.platform }}"

      - name: Enforce runtime vulnerability policy
        uses: ./.github/actions/scan-runtime
        with:
          image-ref: ${{ steps.target.outputs.image-ref }}
          platform: linux/${{ matrix.platform }}
          dockerhub-user: mriverodorta
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
